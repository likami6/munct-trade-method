name: EMA 9/20 Telegram alerts

on:
  schedule:
    # every 5 minutes, offset from :00 because GitHub drops many runs at the top of the hour
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Telegram"
        type: boolean
        default: false

concurrency:
  group: ema-cross-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send test message
        if: ${{ inputs.test }}
        run: python bot/ema_cross_bot.py --test
      # Remembers the last candle checked, so each cross is sent only once
      - name: Restore state
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          path: bot/state.json
          key: ema-bot-state-${{ github.run_id }}
          restore-keys: ema-bot-state-
      - name: Check for EMA cross
        if: ${{ !inputs.test }}
        run: python bot/ema_cross_bot.py
      - name: Save state
        if: ${{ !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: bot/state.json
          key: ema-bot-state-${{ github.run_id }}
